<style>

  body { background: linear-gradient(135deg, #A8E6CF 0%, #FAF3E0 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #2c3e50; }

  .option { background: white; border: 2px solid #D4A574; border-radius: 12px; padding: 15px 20px; cursor: pointer; transition: all 0.3s; display: flex; align-items: flex-start; gap: 12px; text-align: left; font-size: 0.95em; line-height: 1.4; }
  .option:hover { background: #A8E6CF; transform: translateX(5px); border-color: #2c3e50; }
  .option.correct { background: #A8E6CF; border-color: #27ae60; }
  .option.wrong { background: #FF6B6B; border-color: #c0392b; color: white; }
  .option.disabled { pointer-events: none; opacity: 0.6; }
  .option-letter { background: #2c3e50; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
  .option.correct .option-letter { background: #27ae60; }
  .option.wrong .option-letter { background: #c0392b; }
  .feedback { padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; line-height: 1.5; font-size: 0.95em; }
  .feedback.show { display: block; }
  .feedback.success { background: #A8E6CF; border-left: 5px solid #27ae60; }
  .feedback.error { background: #FFE5E5; border-left: 5px solid #FF6B6B; }
  .btn { background: #2c3e50; color: white; border: none; padding: 14px 30px; border-radius: 12px; font-size: 1em; font-weight: bold; cursor: pointer; transition: all 0.3s; width: 100%; margin-top: 10px; }
  .btn:hover { background: #FF6B6B; transform: translateY(-2px); }
  .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #A8E6CF, #27ae60); transition: width 0.5s; border-radius: 4px; }
  .hidden { display: none !important; }
  .letter { background: linear-gradient(135deg, #FFF9E6 0%, #FAF3E0 100%); border: 3px solid #FFD93D; border-radius: 16px; padding: 25px; margin: 20px 0; font-style: italic; line-height: 1.8; }

  .victory h1 { font-size: 2em; color: #27ae60; margin-bottom: 15px; }
  .confetti { font-size: 3em; margin: 20px 0; }
  .round-indicator { text-align: center; font-size: 0.85em; color: #7f8c8d; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
  .ilustration { background: #2c3e50; color: #A8E6CF; padding: 20px; border-radius: 12px; margin: 15px 0; font-family: 'Courier New', monospace; font-size: 0.9em; line-height: 1.6; border-left: 4px solid #FFD93D; }

  .exams table { width: 100%; border-collapse: collapse; }
  .exams th { background: #2c3e50; color: white; padding: 8px; text-align: left; }
  .exams td { padding: 8px; border-bottom: 1px solid #eee; }
  .exams .altered { color: #FF6B6B; font-weight: bold; }

// ==================== ESTADO DO JOGO ====================
let estado = { casoAtual: 0, rodada: 1, moedas: 0, respondeu: false, recompensaDada: false };

// ==================== FUNÇÕES ====================
function renderizar() {
  const caso = casos[estado.casoAtual];
  const content = document.getElementById('gameContent');
  const roundIndicator = document.getElementById('roundIndicator');
  const progressFill = document.getElementById('progressFill');
  
  document.getElementById('caseDisplay').textContent = `Caso ${estado.casoAtual + 1}/${casos.length}`;
  document.getElementById('coinsDisplay').textContent = `💎 ${estado.moedas}`;
  progressFill.style.width = `${((estado.casoAtual * 4 + estado.rodada) / (casos.length * 4)) * 100}%`;
  
  if (estado.rodada === 1) { roundIndicator.textContent = "RODADA 1 DE 4 — ANAMNESE"; renderRodada1(caso, content); }
  else if (estado.rodada === 2) { roundIndicator.textContent = "RODADA 2 DE 4 — SEMIOLOGIA"; renderRodada2(caso, content); }
  else if (estado.rodada === 3) { roundIndicator.textContent = "RODADA 3 DE 4 — TRATAMENTO"; renderRodada3(caso, content); }
  else if (estado.rodada === 4) { roundIndicator.textContent = "RODADA 4 DE 4 — DESFECHO"; renderRodada4(caso, content); }
}

function responder(letra, correta, explicacao) {
  if (estado.respondeu) return;
  estado.respondeu = true;
  const options = document.querySelectorAll('.option');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  
  options.forEach(opt => {
    const optLetra = opt.querySelector('.option-letter').textContent;
    opt.classList.add('disabled');
    if (optLetra === correta) opt.classList.add('correct');
    else if (optLetra === letra && letra !== correta) opt.classList.add('wrong');
  });
  
  if (letra === correta) {
    feedback.className = 'feedback success show';
    feedback.innerHTML = `✅ <strong>Correto!</strong><br><br>${explicacao}`;
    nextBtn.classList.remove('hidden');
  } else {
    feedback.className = 'feedback error show';
    feedback.innerHTML = `❌ <strong>Incorreto.</strong> A resposta correta era <strong>${correta}</strong>.<br><br>${explicacao}<br><br><em>O paciente piorou. Reinicie o caso.</em>`;
    const btnReiniciar = document.createElement('button');
    btnReiniciar.className = 'btn';
    btnReiniciar.textContent = 'REINICIAR CASO';
    btnReiniciar.onclick = reiniciarCaso;
    feedback.appendChild(btnReiniciar);
  }
}

function proximaRodada() { estado.rodada++; estado.respondeu = false; renderizar(); window.scrollTo(0,0); }
function proximoCaso() {
  estado.casoAtual++; estado.rodada = 1; estado.respondeu = false; estado.recompensaDada = false;
  if (estado.casoAtual >= casos.length) { finalizarJogo(); return; }
  renderizar(); window.scrollTo(0,0);
}
function reiniciarCaso() { estado.rodada = 1; estado.respondeu = false; estado.recompensaDada = false; renderizar(); window.scrollTo(0,0); }

function finalizarJogo() {
  document.getElementById('gameContent').innerHTML = `
    <div class="victory">
      <div class="confetti">🏆🎉🏆🎉🏆</div>
      <h1>PARABÉNS, DETETIVE!</h1>
      <p style="font-size:1.1em; margin:20px 0;">Você completou todos os 25 casos!</p>
      <div style="background:#FFD93D; padding:20px; border-radius:12px; margin:20px 0;">
        <strong style="font-size:1.3em;">💎 Total de Moedas Vita: ${estado.moedas}</strong>
      </div>
      <button class="btn" onclick="location.reload()">JOGAR NOVAMENTE</button>
    </div>
  `;
  document.getElementById('progressFill').style.width = "100%";
  document.getElementById('roundIndicator').textContent = "FIM DO JOGO";
}

renderizar();
</script>
</body>
</html>
